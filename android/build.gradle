    plugins {
        id "com.android.application"
        id "kotlin-android"
        id "dev.flutter.flutter-gradle-plugin"
    }

    android {
        namespace "com.example.electroshop_app"
        compileSdkVersion 34

        defaultConfig {
            applicationId "com.example.electroshop_app"
            minSdkVersion 21
            targetSdkVersion 34
            versionCode 1
            versionName "1.0"
        }

        buildTypes {
            release {
                signingConfig signingConfigs.debug
            }
        }
    }

    flutter {
        source "../.."
    }

    dependencies {
        implementation "androidx.core:core-ktx:1.12.0"
        implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    }




























































